name: Update Matrix x Doraemon Profile

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/update-profile.yml'

permissions:
  contents: write

jobs:
  telemetry:
    name: Update 4D Pocket Telemetry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Matrix Telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_telemetry.py

      - name: Commit and push telemetry SVG if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/matrix-telemetry.svg)" ]; then
            git add assets/matrix-telemetry.svg
            git commit -m "chore(telemetry): update 4D pocket matrix telemetry"
            git push
          else
            echo "No changes to assets/matrix-telemetry.svg"
          fi

  snake:
    name: Generate Matrix Contribution Snake
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub contribution snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: elijah7x
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300A2FF&color_dots=%230d1912,%23144626,%231e7a3a,%2327b54f,%2339ff14

      - name: Deploy snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
