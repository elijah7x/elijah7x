<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="900" height="84" role="img" aria-label="elijah7x Matrix Time Machine Footer">
<style>
@keyframes speed-scroll {
  0% { transform: translateX(0px); }
  100% { transform: translateX(-300px); }
}
@keyframes tm-glide {
  0% { transform: translateX(-80px); }
  100% { transform: translateX(920px); }
}
@keyframes tm-bob {
  0%, 100% { transform: translateY(-2px); }
  50% { transform: translateY(2px); }
}
.speed-fast { animation: speed-scroll 1.8s linear infinite; }
.speed-slow { animation: speed-scroll 3.1s linear infinite; }
.tm-glide { animation: tm-glide 12s linear infinite -4.2s; }
.tm-bob { animation: tm-bob 1.4s ease-in-out infinite; }
